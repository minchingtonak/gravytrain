services:
  whoami:
    image: "traefik/whoami"
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`${WHOAMI_PROXY_DOMAIN}`)
      - traefik.http.routers.whoami.entrypoints=https
      - traefik.http.routers.whoami.tls=true
      - traefik.http.routers.whoami.tls.certresolver=porkbun
      # - traefik.http.services.whoami.loadbalancer.server.port=3001
    networks:
      - traefik
networks:
  traefik:
    external: true